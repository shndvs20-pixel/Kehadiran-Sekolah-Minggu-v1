name: Build Kehadiran Sekolah Minggu APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle clean assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Kehadiran-Sekolah-Minggu-v1.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kehadiran-Sekolah-Minggu-v1.3-APK
          path: Kehadiran-Sekolah-Minggu-v1.3.apk
