name: Build Kehadiran Sekolah Minggu APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract attendance Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "Kehadiran_Sekolah_Minggu_Android_Source.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Kehadiran_Sekolah_Minggu_Android_Source.zip not found."
            exit 1
          fi
          rm -rf build_attendance
          mkdir -p build_attendance
          unzip -q "$ZIP_FILE" -d build_attendance

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: build_attendance
        run: gradle clean assembleDebug --no-daemon

      - name: Rename APK
        run: cp build_attendance/app/build/outputs/apk/debug/app-debug.apk Kehadiran-Sekolah-Minggu-v1.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kehadiran-Sekolah-Minggu-v1.3-APK
          path: Kehadiran-Sekolah-Minggu-v1.3.apk
